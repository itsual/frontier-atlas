<!DOCTYPE html>
<html lang="en">
<head>

    header { border-bottom: 1px solid var(--border); padding: 28px 0 20px; }
    .mast { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: end; }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

    .sub { color: var(--muted); margin: 8px 0 0; font-size: 14px; }

    nav button, .chip {

      background: var(--accent); color: var(--accent-fg);
    }

    .grid2 { display: grid; gap: 40px; }
    @media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1.05fr; } }
    input, select {
      height: 48px; width: 100%; padding: 0 16px; border: 0; border-radius: 12px;
      background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--border);
      font: inherit; font-size: 14px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .panel {
      background: var(--surface); border-radius: 18px; padding: 28px;
      box-shadow: 0 0 0 1px var(--border);
    }
    .dot { width: 6px; height: 6px; border-radius: 99px; display: inline-block; }
    .openai { background: var(--openai); } .anthropic { background: var(--anthropic); }
    .xai { background: var(--xai); } .google { background: var(--google); }
    .model-name { font-size: 2rem; margin-top: 8px; }
    .effort { font-family: var(--mono); color: var(--accent); font-size: 14px; margin-top: 6px; }
    .muted { color: var(--muted); font-size: 14px; }
    .fg { font-size: 14px; }
    .list { list-style: none; padding: 0; margin: 16px 0 0; }
    .list li { border-top: 1px solid var(--border); }
    .list button, .cardbtn {
      width: 100%; text-align: left; background: transparent; border: 0;
      color: inherit; padding: 12px 0; display: flex; justify-content: space-between; gap: 16px;
    }

    .cards { display: grid; gap: 8px; margin-top: 16px; }
    @media (min-width: 700px) { .cards.two { grid-template-columns: 1fr 1fr; } }
    .cardbtn {
      background: var(--surface); padding: 14px 16px; border-radius: 12px;
      box-shadow: 0 0 0 1px var(--border); flex-direction: column; align-items: start; gap: 4px;
    }
    .cardbtn.on { background: var(--raised); }
    .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    @media (min-width: 600px) { .specs { grid-template-columns: repeat(4, 1fr); } }
    .spec { background: var(--raised); border-radius: 8px; padding: 10px 12px; }
    .spec dt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle); }
    .spec dd { margin: 4px 0 0; font-family: var(--mono); font-size: 12px; }
    footer { border-top: 1px solid var(--border); padding: 24px 0; color: var(--subtle); font-size: 12px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .move { background: var(--raised); border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
  </style>
</head>

const state = { view: "advise", q: "", rec: null, lab: "all", model: "gpt-56-sol", effort: "medium", left: "gpt-56-sol", right: "claude-sonnet-5" };
const $ = (id) => document.getElementById(id);
const model = (id) => MODELS.find((m) => m.id === id);
const elabel = (lab, e) => (EFFORTS[lab] && EFFORTS[lab][e] && EFFORTS[lab][e].label) || e;

function recommend(raw) {
  const q = raw.toLowerCase();
  let bestA = null, bestS = 0;
  for (const a of ACTIVITIES) {
    let s = 0;
    for (const w of a.q.split(" ")) if (q.includes(w) || a.label.toLowerCase().includes(q)) s += q.includes(w) ? 2 : 0;
    if (a.label.toLowerCase().includes(q)) s += 6;
    if (s > bestS) { bestS = s; bestA = a; }
  }
  let bestSnap = null, ss = 0;
  for (const r of SNAP) {
    const s = (q && r.s.toLowerCase().includes(q)) || r.c.toLowerCase().includes(q) ? 4 : 0;
    for (const w of q.split(/\s+/)) if (w.length > 3 && r.s.toLowerCase().includes(w)) s && (ss = Math.max(ss, 3));
    let t = 0;
    for (const w of q.split(/\s+/)) if (w.length > 3 && (r.s.toLowerCase().includes(w) || r.c.toLowerCase().includes(w))) t += 2;
    if (t > ss) { ss = t; bestSnap = r; }
  }
  if (bestA && bestS >= ss && bestS > 0) return { model: model(bestA.model), effort: bestA.effort, why: bestA.label, up: bestA.up };
  if (bestSnap && ss > 0) return { model: model(bestSnap.id), effort: bestSnap.e, why: bestSnap.s, up: null };
  const named = MODELS.find((m) => m.name.toLowerCase().includes(q) || (m.api && m.api.includes(q)));
  if (named) return { model: named, effort: named.def, why: named.pos, up: null };
  return { model: model("gpt-56-sol"), effort: "medium", why: "No close match. Documented general default: GPT-5.6 Sol at Medium.", up: null };
}

function nav() {
  const views = [["advise","Advise"],["desk","Desk"],["playbook","Playbook"],["compare","Compare"]];
  $("nav").innerHTML = views.map(([id,l]) =>
    `<button type="button" data-view="${id}" aria-current="${state.view===id}">${l}</button>`
  ).join("");
  $("nav").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    state.view = b.dataset.view;
    render();
  };
}

        ["Almost everything on Grok","Grok 4.6"],
        ["Almost everything on Gemini","3.7 Flash"],
      ].map(([k,v]) => `<li><div class="muted" style="padding:12px 0"><div>${k}</div><div class="model-name" style="font-size:1.25rem">${v}</div></div></li>`).join("")}</ul></aside>`;
  }
  const m = rec.model;
  const cell = m.matrix[rec.effort];
  return `<aside class="panel">
    <p class="kicker">Recommendation · <span class="dot ${m.lab}"></span> ${LABS[m.lab].name}</p>
    <h2 class="model-name">${m.name}</h2>
    <p class="effort">${elabel(m.lab, rec.effort)}</p>
    <p class="muted">${m.pos}</p>
    ${cell ? `<p class="fg" style="margin-top:14px">${cell}</p>` : ""}
    <p class="muted">${rec.why}</p>
    ${rec.up ? `<div class="move"><p class="kicker">Move up when</p><p class="fg">${rec.up}</p></div>` : ""}
    <button class="chip on" style="margin-top:18px" data-open="${m.id}" data-e="${rec.effort}">Open on the desk</button>
  </aside>`;
}

function advise() {
  return `<div class="grid2">
    <div>
      <p class="kicker">Five-second desk</p>
      <h2>What are you trying to do?</h2>
      <p class="muted">Describe the work. Atlas maps it onto a model × effort pair.</p>
      <form id="f" style="margin-top:20px" class="row">
        <label class="sr" for="q">Task</label>
        <input id="q" value="${state.q.replace(/"/g,""")}" placeholder="e.g. architecture review for a payments service" style="flex:1; min-width:220px" />
        <button class="chip on" type="submit">Map it</button>
      </form>
      <p class="kicker" style="margin-top:36px">Or start from a situation</p>
      <ul class="list" id="snaps">${SNAP.map((r,i)=>`<li><button type="button" data-snap="${i}"><span>${r.s}</span><span class="mono">${r.c}</span></button></li>`).join("")}</ul>
    </div>
    ${resultHTML(state.rec)}
  </div>`;
}

function desk() {
  const list = MODELS.filter((m) => state.lab === "all" || m.lab === state.lab);
  const m = model(state.model);
  const meta = EFFORTS[m.lab][state.effort];
  const cell = m.matrix[state.effort];
  return `<div class="grid2">
    <div>
      <div class="row" id="labs">
        <button class="chip ${state.lab==="all"?"on":""}" data-lab="all">All labs</button>
        ${Object.entries(LABS).map(([id,l]) => `<button class="chip ${state.lab===id?"on":""}" data-lab="${id}"><span class="dot ${id}"></span>${l.short}</button>`).join("")}
      </div>
      <div class="cards" id="models">${list.map((x) => `<button class="cardbtn ${x.id===m.id?"on":""}" data-model="${x.id}">
        <strong>${x.name}</strong><span class="muted" style="font-size:12px">${x.pos}</span>
      </button>`).join("")}</div>
    </div>
    <article class="panel">
      <p class="kicker"><span class="dot ${m.lab}"></span> ${LABS[m.lab].name} · ${LABS[m.lab].noun}</p>
      <h2 class="model-name">${m.name}</h2>
      ${m.api ? `<p class="mono">${m.api}</p>` : ""}
      <p class="fg" style="margin-top:12px">${m.pos}</p>
      <dl class="specs">
        ${m.ctx ? `<div class="spec"><dt>Context</dt><dd>${m.ctx}</dd></div>` : ""}
        ${m.price ? `<div class="spec"><dt>API</dt><dd>${m.price}</dd></div>` : ""}
        <div class="spec"><dt>Status</dt><dd>${m.status}</dd></div>
        <div class="spec"><dt>Default</dt><dd>${elabel(m.lab, m.def)}</dd></div>
      </dl>
      <div class="row" id="efforts">${m.efforts.map((e) => `<button class="chip ${e===state.effort?"on":""}" data-effort="${e}">${elabel(m.lab,e)}</button>`).join("")}</div>
      ${cell ? `<p class="fg" style="margin-top:22px; padding-top:18px; border-top:1px solid var(--border)">${cell}</p>` : ""}
      ${meta ? `<dl class="specs" style="grid-template-columns:1fr 1fr; margin-top:18px">
        <div class="spec"><dt>Use when</dt><dd style="font-family:var(--sans); font-size:13px; color:var(--muted)">${meta.use}</dd></div>
        <div class="spec"><dt>Not merely because</dt><dd style="font-family:var(--sans); font-size:13px; color:var(--muted)">${meta.dont}</dd></div>
      </dl>` : ""}
    </article>
  </div>`;
}

function playbook() {
  return `<p class="kicker">Activity playbook</p><h2>Start from the work, not the brand.</h2>
    <ul class="list">${ACTIVITIES.map((a,i) => {
      const m = model(a.model);
      return `<li><button type="button" data-act="${i}"><span><span class="mono">${a.label}</span></span><span class="mono">${m.name} · ${elabel(m.lab,a.effort)}</span></button></li>`;
    }).join("")}</ul>`;
}

function compare() {
  const opts = MODELS.map((m) => `<option value="${m.id}">${m.name}</option>`).join("");
  const card = (id) => {
    const m = model(id);
    return `<article class="panel"><p class="kicker"><span class="dot ${m.lab}"></span> ${LABS[m.lab].name}</p>
      <h3 class="model-name" style="font-size:1.6rem">${m.name}</h3>
      <p class="muted">${m.pos}</p>
      <dl class="specs">${m.price?`<div class="spec"><dt>API</dt><dd>${m.price}</dd></div>`:""}${m.ctx?`<div class="spec"><dt>Context</dt><dd>${m.ctx}</dd></div>`:""}</dl>
      <ul class="list">${m.efforts.map((e)=>`<li style="padding:10px 0"><p class="effort">${elabel(m.lab,e)}</p><p class="fg">${m.matrix[e]}</p></li>`).join("")}</ul>
    </article>`;
  };
  return `<p class="kicker">Side by side</p><h2>Compare two models</h2>
    <div class="grid2" style="margin-top:20px; grid-template-columns:1fr 1fr">
      <label><span class="mono">Left</span><select id="left">${opts}</select></label>
      <label><span class="mono">Right</span><select id="right">${opts}</select></label>
    </div>
    <div class="grid2" style="margin-top:20px">${card(state.left)}${card(state.right)}</div>`;
}

function bind() {
  if (state.view === "advise") {
    $("f").onsubmit = (e) => { e.preventDefault(); state.q = $("q").value; state.rec = recommend(state.q); const r = state.rec; if (r) { state.model = r.model.id; state.effort = r.effort; } render(); };
    document.querySelectorAll("[data-snap]").forEach((b) => b.onclick = () => {
      const r = SNAP[+b.dataset.snap]; state.q = r.s; state.rec = { model: model(r.id), effort: r.e, why: r.s, up: null };
      state.model = r.id; state.effort = r.e; render();
    });
    document.querySelector("[data-open]")?.addEventListener("click", (e) => {
      state.model = e.currentTarget.dataset.open; state.effort = e.currentTarget.dataset.e; state.view = "desk"; render();
    });
  }
  if (state.view === "desk") {
    $("labs")?.addEventListener("click", (e) => { const b = e.target.closest("[data-lab]"); if (!b) return; state.lab = b.dataset.lab; render(); });
    $("models")?.addEventListener("click", (e) => { const b = e.target.closest("[data-model]"); if (!b) return; state.model = b.dataset.model; state.effort = model(state.model).def; render(); });
    $("efforts")?.addEventListener("click", (e) => { const b = e.target.closest("[data-effort]"); if (!b) return; state.effort = b.dataset.effort; render(); });
  }
  if (state.view === "playbook") {
    document.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => {
      const a = ACTIVITIES[+b.dataset.act]; state.q = a.label; state.rec = { model: model(a.model), effort: a.effort, why: a.label, up: a.up||null };
      state.model = a.model; state.effort = a.effort; state.view = "advise"; render();
    });
  }
  if (state.view === "compare") {
    $("left").value = state.left; $("right").value = state.right;
    $("left").onchange = (e) => { state.left = e.target.value; render(); };
    $("right").onchange = (e) => { state.right = e.target.value; render(); };
  }
}

function render() {
  nav();
  const map = { advise, desk, playbook, compare };
  $("app").innerHTML = map[state.view]();
  bind();
}
render();
</script>
</body>
</html>
